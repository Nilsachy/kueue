apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
        - name: manager
          ports:
            - containerPort: 8082
              name: visibility
              protocol: TCP
          volumeMounts:
            - mountPath: /visibility
              name: visibility
      volumes:
        - name: visibility
          emptyDir: {}
